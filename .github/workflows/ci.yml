# CI: runs the same checks as "pnpm check" on a clean GitHub machine
# for every push and pull request. No secrets are needed.
name: CI

on:
  push:
  pull_request:

# Read-only access: this workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Disposable PostgreSQL 17 for the database tests, deleted after each run.
    # Its passwords are NOT secrets: the database holds no real data and is
    # only reachable from this job. Real passwords never appear in this file.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_postgres_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://alaa_app:ci_app_only@localhost:5432/alaa_ad_manager_test
      TEST_MIGRATE_DATABASE_URL: postgresql://alaa_migrator:ci_migrator_only@localhost:5432/alaa_ad_manager_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js (version from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: fail instead of silently changing pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same roles and privileges as the development computer (docs/development.md):
      # alaa_migrator owns the database, alaa_app can only read and write data.
      - name: Prepare test database roles
        env:
          PGPASSWORD: ci_postgres_only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE alaa_migrator WITH LOGIN CREATEDB PASSWORD 'ci_migrator_only';
          CREATE ROLE alaa_app WITH LOGIN PASSWORD 'ci_app_only';
          CREATE DATABASE alaa_ad_manager_test OWNER alaa_migrator;
          \c alaa_ad_manager_test
          GRANT USAGE ON SCHEMA public TO alaa_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE alaa_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO alaa_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE alaa_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO alaa_app;
          SQL

      - name: Format, lint, typecheck and test
        run: pnpm check
