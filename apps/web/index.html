<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b16" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070b16'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='%23d9b766'/%3E%3C/svg%3E"
    />
    <title>ALAA AD MANAGER</title>
    <script>
      // Applies the saved theme before the page is drawn (no flash). ADR 0017.
      try {
        if (localStorage.getItem('alaa.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
